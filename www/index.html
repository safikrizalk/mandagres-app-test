<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#022c22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>html,body{overscroll-behavior-y:contain}*{-webkit-tap-highlight-color:transparent}</style>
<title>Mandagres - Dashboard Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4ef;--c:#fff;--t:#14211a;--mu:#6d7c72;--bd:#e0e6dd;--tr:#e4eadf;
  --d:#022c22;--m:#336040;--l:#8dbb4f;--a:#4f7f32;--a-ink:#fff;
  --s1:#2f5d3a;--s2:#9cc85b;--warn:#e6a73a;--bad:#c9473b;
  --shadow:0 8px 24px rgba(2,44,34,.10);
  --r:16px;--r2:12px;
}
:root[data-theme="dark"]{
  --bg:#0c110e;--c:#151e19;--t:#eef3ee;--mu:#97a89d;--bd:#26342c;--tr:#26342c;
  --a:#6fa83f;--s1:#b9e37c;--s2:#5f8c3e;--shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:600 14px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--l);outline-offset:2px;border-radius:8px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- kerangka ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{background:var(--c);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:0 14px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:24px 8px 18px}
.brand img{width:48px;height:auto}
.brand b{display:block;font-size:21px;font-weight:800;line-height:1.1}
.brand span{color:var(--mu);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px;padding:6px 0}
nav hr{border:0;border-top:1px solid var(--bd);margin:10px 4px}
.ni{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mu);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,color .15s}
.ni:hover{background:var(--bg);color:var(--t)}
.ni.on{background:var(--a);color:var(--a-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:14px}
.nara{background:var(--d);border-radius:var(--r);padding:16px 14px 14px;position:relative;overflow:hidden;border:1px solid var(--bd);margin-bottom:6px}
.nara:before,.nara:after{content:"";position:absolute;background:var(--l);opacity:.9}
.nara:before{width:34px;height:34px;top:-8px;right:34px;border-radius:50% 50% 50% 0}
.nara:after{width:26px;height:26px;top:-10px;right:2px;border-radius:50% 50% 0 50%}
.nara h4{color:var(--l);font-size:15px;font-weight:800;margin-bottom:10px}
.nb{display:flex;justify-content:space-between;align-items:center;background:#fff;color:#14211a;border-radius:9px;padding:9px 12px;margin-top:6px;font-size:13px;font-weight:700}
.nb:hover{background:#e9f2dc}
.mode{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;color:var(--mu);font-size:15px;font-weight:700}
.mode span{display:flex;align-items:center;gap:12px}
.sw{width:46px;height:26px;border:0;border-radius:20px;background:var(--tr);position:relative;cursor:pointer;padding:0;transition:background .2s}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--d);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--m)}
.sw[aria-checked="true"]:after{transform:translateX(20px);background:var(--l)}
.ni.out{margin-top:2px}

main{padding:20px 24px 48px;min-width:0}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.greet{min-width:190px;margin-right:4px}
.greet small{display:block;color:var(--mu);font-size:14px}
.greet b{font-size:25px;font-weight:800;line-height:1.2}
.sr{flex:1;min-width:170px;background:var(--c);border:1px solid var(--bd);border-radius:12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mu)}
.sr:focus-within{border-color:var(--a)}
.sr input{border:0;background:none;outline:0;font:inherit;color:var(--t);flex:1;min-width:0}
.sq{width:44px;height:44px;background:var(--c);border:1px solid var(--bd);border-radius:12px;display:grid;place-items:center;position:relative;cursor:pointer}
.sq:hover{border-color:var(--a)}
.sq i{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--c);box-sizing:content-box}
.menu{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--c);place-items:center;cursor:pointer}
.scrim{display:none}

/* ---------- komponen dasar ---------- */
.card{background:var(--c);border:1px solid var(--bd);border-radius:var(--r);padding:18px;min-width:0}
.card[data-go]{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card[data-go]:hover{border-color:var(--a);box-shadow:var(--shadow)}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ct h3{font-size:18px;font-weight:800}
.ct small,.upd{color:var(--mu);font-size:12px;font-weight:600}
.link{color:var(--a);font-size:13px;font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.r2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer;transition:filter .15s}
.pb:hover{filter:brightness(1.1)}
.pb:disabled{opacity:.45;cursor:not-allowed}
.pb.wide{width:100%}
.btn{display:flex;gap:8px;justify-content:center;align-items:center;border:1.5px solid var(--bd);background:none;border-radius:10px;padding:10px;width:100%;font-weight:700;font-size:13px;cursor:pointer;margin-top:12px}
.btn:hover{background:var(--bg)}
.btn .ico{width:16px;height:16px}
.tag{display:inline-block;background:var(--a);color:#fff;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.o{background:#c98718}.tag.r{background:var(--bad)}.tag.g{background:var(--m)}
:root[data-theme="dark"] .tag.g{background:#4a7a55}
.pt{font-size:28px;font-weight:800;line-height:1.2}
.sub{color:var(--mu);margin:4px 0 20px}
.bk{display:inline-flex;align-items:center;gap:4px;color:var(--a);font-weight:700;margin-bottom:12px;cursor:pointer}
.bk:hover{text-decoration:underline}
.bk .ico{width:16px;height:16px}
.page>.pt{margin-top:0}
.page>.sub+*,.page>.pt+*{margin-top:0}

/* ---------- ilustrasi ---------- */
.art{--tb:#336040;--tb2:#5f8c3e;position:relative;border-radius:var(--r2);overflow:hidden;background:linear-gradient(135deg,var(--tb),var(--tb2));aspect-ratio:8/5;width:100%}
.art svg{display:block;width:100%;height:100%}
.art.sm{width:56px;aspect-ratio:1;flex:none;border-radius:12px}
.art.xs{width:34px;aspect-ratio:1;flex:none;border-radius:9px}
.t-g{--tb:#336040;--tb2:#5f8c3e}.t-d{--tb:#022c22;--tb2:#336040}.t-t{--tb:#17695f;--tb2:#36a090}
.t-a{--tb:#b06d14;--tb2:#e0a43a}.t-o{--tb:#587b22;--tb2:#8dbb4f}.t-c{--tb:#a2403a;--tb2:#d76f5d}.t-b{--tb:#275f85;--tb2:#4e98c0}
.w{fill:#fff}.w2{fill:#fff;fill-opacity:.55}.c{fill:var(--tb)}
.ws{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ws2{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cs{fill:none;stroke:var(--tb);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.art.cover{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px 12px 24px;border-radius:6px 12px 12px 6px}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.22)}
.cover svg{width:100%;height:auto;flex:none}
.cover span{color:#fff;font-weight:800;font-size:15px;line-height:1.2}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:14px;align-items:start}
.stat{border-radius:var(--r);padding:14px 18px 16px;cursor:pointer;border:1px solid var(--bd);background:var(--c);transition:box-shadow .15s,border-color .15s;min-width:0}
.stat:hover{box-shadow:var(--shadow)}
.stat .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stat h3{font-size:17px;font-weight:800;color:var(--m)}
.stat .sb{display:flex;align-items:flex-end;gap:16px}
.stat .n{font-size:58px;font-weight:800;line-height:1}
.stat ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--bd);font-size:12.5px;line-height:1.6;white-space:nowrap}
.stat.dk{background:var(--d);border-color:var(--d);color:#fff}
.stat.dk h3{color:var(--l)}
.stat.dk ul{border-color:var(--l)}
:root[data-theme="dark"] .stat h3{color:var(--l)}
.hero{position:relative;overflow:hidden;height:142px;border-radius:var(--r);background:linear-gradient(100deg,#336040 40%,#10331f);color:#fff;padding:22px 20px;cursor:pointer}
.hero h2{font-size:26px;font-weight:800;line-height:1.15}
.hero .cls{font-size:19px;font-weight:700;color:var(--l);margin-top:2px}
.hero .ids{position:absolute;left:20px;bottom:16px;display:flex;gap:18px;font-size:12.5px;opacity:.92}
.hero img{position:absolute;right:-6px;bottom:0;height:164px;pointer-events:none;clip-path:inset(21px 0 0 0)}
.hero .rk{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:800}
.hero .rk .ico{width:18px;height:18px}
.mp{height:166px;padding:14px 16px}
.mp h3{font-size:17px;font-weight:800;margin-bottom:10px}
.mpg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.mpi{display:flex;gap:9px;align-items:center;min-width:0}
.mpi b{font-size:21px;font-weight:800;line-height:1;display:block}
.mpi small{display:block;color:var(--mu);font-size:11.5px;line-height:1.2;font-weight:700}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.cl{min-width:0}
.cl .art{margin-bottom:8px}
.cl small{display:block;color:var(--mu);font-size:12px}
.cl b{display:block;font-size:14px;line-height:1.25}
.bar{display:grid;grid-template-columns:34px 200px minmax(0,1fr) 28px;align-items:center;gap:12px;margin:10px 0;font-size:13px}
.bar .tk{height:12px;background:var(--tr);border-radius:8px;overflow:hidden}
.bar .tk i{display:block;height:100%;background:var(--m);border-radius:8px}
:root[data-theme="dark"] .bar .tk i{background:var(--l)}
.bar>b{text-align:right}
.bar span small{display:block;color:var(--mu);font-size:11.5px;font-weight:600}
.rank{display:flex;gap:8px;align-items:center;font-weight:800;font-size:15px}
.sel{background:var(--a);color:#fff;border:0;border-radius:22px;font:800 15px Nunito,system-ui,sans-serif;padding:8px 18px;cursor:pointer}
.lgd{display:flex;gap:16px;justify-content:flex-end;margin:10px 0 2px;font-size:12px;flex-wrap:wrap}
.lgd span{display:inline-flex;gap:6px;align-items:center}
.lgd i{width:18px;height:6px;border-radius:4px;display:inline-block}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--bd);stroke-dasharray:3 3;stroke-width:1}
.chart text{fill:var(--mu);font:600 10px Nunito,system-ui,sans-serif}
.rm{display:flex;background:var(--c);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;cursor:pointer;align-items:stretch}
.rm:hover{border-color:var(--a)}
.rm .gf{background:var(--a);width:58px;display:grid;place-items:center;color:#fff;flex:none}
.rm div+div{padding:9px 14px;font-size:13px;line-height:1.45}
.dn{text-align:center;position:relative;margin:6px auto 10px;width:150px}
.dn svg{width:100%;display:block}
.dn b{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:800}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.lg span{display:flex;gap:7px;align-items:center;line-height:1.35}
.lg i{width:6px;height:30px;border-radius:6px;flex:none}
.dots{color:var(--mu);letter-spacing:2px;font-weight:800}

/* ---------- daftar & halaman lain ---------- */
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:first-child{padding-top:0}.row:last-child{border:0;padding-bottom:0}
.row .tx{flex:1;min-width:0}
.row small{display:block;color:var(--mu);font-weight:600}
.ra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.amt{font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tb{padding:8px 18px;border-radius:20px;background:var(--c);border:1px solid var(--bd);cursor:pointer;font-weight:800}
.tb:hover{border-color:var(--a)}
.tb.on{background:var(--a);border-color:var(--a);color:#fff}
.news{display:flex;flex-direction:column;gap:10px}
.news small{color:var(--mu)}
.news b{font-size:15px;line-height:1.3}
.news .pb{align-self:flex-start;margin-top:auto}
.prod .card{display:flex;flex-direction:column;gap:12px}
.pi{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{color:var(--a);font-weight:800}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--bd);border-radius:10px;padding:3px}
.qty button{width:34px;height:30px;border:0;background:var(--bg);border-radius:8px;font-size:18px;font-weight:800;cursor:pointer}
.qty button:hover{background:var(--tr)}
.cartbar{position:sticky;bottom:14px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;background:var(--d);color:#fff;border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);z-index:2}
.cartbar small{display:block;color:var(--l);font-weight:700}
.cartbar .pb{background:var(--l);color:var(--d)}
.book{display:flex;flex-direction:column;gap:12px}
.book b{font-size:14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.sum small{color:var(--mu);display:block}
.sum b{font-size:24px;font-weight:800}
.big{font-size:44px;font-weight:800;line-height:1.1;color:var(--a)}
.mapcat{display:flex;gap:12px;align-items:center}
.mapcat small{color:var(--mu);display:block}
.subj{display:flex;gap:12px;align-items:center}
.subj b{display:block;line-height:1.25}
.subj small{color:var(--mu);display:block}
.score{margin-left:auto;text-align:right;font-size:22px;font-weight:800;color:var(--a);line-height:1}
.score small{font-size:11px;font-weight:700;color:var(--mu);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{padding:10px 0;border-radius:8px;background:var(--bg)}
.cal .dh{background:none;color:var(--mu);font-size:12px;padding:0 0 2px}
.cal .e{background:none}
.cal .h{background:var(--l);color:#12310f}
.cal .i{background:var(--m);color:#fff}
.cal .tl{background:var(--warn);color:#222}
.cal .x{opacity:.4}
.keys{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys i{width:12px;height:12px;border-radius:4px;display:inline-block}
.ch{height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ms{max-width:75%;padding:9px 14px;border-radius:14px 14px 14px 4px;background:var(--bg)}
.ms.me{align-self:flex-end;background:var(--a);color:#fff;border-radius:14px 14px 4px 14px}
.in{display:flex;gap:8px}
.in input{flex:1;min-width:0;border:1.5px solid var(--bd);background:var(--bg);color:var(--t);border-radius:10px;padding:10px 12px;font:600 14px Nunito,system-ui,sans-serif;outline:0}
.in input:focus{border-color:var(--a)}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof img{width:84px;height:auto}
.prof h2{font-size:24px}
.prof p{color:var(--mu)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--d);color:#fff;padding:11px 20px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:30;border:1px solid var(--l)}
#toast.s{opacity:1;transform:translate(-50%,0)}
.out{min-height:100vh;display:grid;place-items:center;text-align:center;gap:14px}
.out img{width:90px}
.out h2{margin:12px 0 16px}

/* ---------- responsif ---------- */
@media(max-width:1100px){
  .dash{grid-template-columns:1fr}
  .dash .side{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .r3{grid-template-columns:1fr}
  .r2{grid-template-columns:1fr}
  .mp{height:auto}
  .bar{grid-template-columns:34px 150px minmax(0,1fr) 28px}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow);height:auto}
  body.nav aside{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .menu{display:grid}
  main{padding:16px 16px 40px}
  .greet{order:1;flex:1;min-width:0}
  .menu{order:0}
  .sr{order:3;flex-basis:100%}
  .sq{order:2}
}
@media(max-width:560px){
  .bar{grid-template-columns:34px minmax(0,1fr) 28px}
  .bar .tk{grid-column:2/4;order:5}
  .bar>span:nth-child(2){grid-column:2}
  .row{flex-wrap:wrap}
  .ra{width:100%;justify-content:flex-start}
  .hero h2{font-size:21px;max-width:52%}
  .hero .cls{font-size:17px}
  .hero .ids{flex-direction:column;gap:0;line-height:1.5}
  #chart{overflow-x:auto}
  .chart{min-width:600px}
  .stat .n{font-size:50px}
  .pt{font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- tambahan: bahasa, login, perpustakaan, keuangan ---------- */
:root[lang="ar"] body,:root[lang="ar"] .sel,:root[lang="ar"] .in input,:root[lang="ar"] .fld input{font-family:"Noto Sans Arabic",Nunito,system-ui,sans-serif}
.lang{display:flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px}
.lb{border:0;background:none;border-radius:16px;padding:4px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--mu);font-family:inherit}
.lb:hover{color:var(--t)}.lb.on{background:var(--a);color:#fff}
.mode.lr{padding-top:4px;padding-bottom:4px;font-size:14px;gap:8px}.mode.lr span{gap:8px}
.bi{width:56px;height:56px;border-radius:12px;background:var(--bg);border:1px dashed var(--bd);display:grid;place-items:center;font-size:26px;flex:none}
.pg{height:12px;background:var(--tr);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.pg i{display:block;height:100%;background:var(--m);border-radius:8px}
:root[data-theme="dark"] .pg i{background:var(--l)}

.book small{color:var(--mu);display:block;margin-top:2px}

.lcard h1{text-align:center;font-size:26px}
.lcard .lead{text-align:center;color:var(--mu);margin:4px 0 18px}
.llang{display:flex;justify-content:flex-end;margin-bottom:6px}
.fld{display:block;margin-bottom:14px}.fld>span{display:block;font-weight:800;margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--bd);background:var(--bg);color:var(--t);border-radius:10px;padding:12px;font:600 15px Nunito,system-ui,sans-serif;outline:0}
.fld input:focus{border-color:var(--a)}
.pw{position:relative}.pw input{padding-inline-end:48px}
.pw button{position:absolute;top:0;bottom:0;inset-inline-end:4px;border:0;background:none;cursor:pointer;padding:0 10px;font-size:18px}
.err{color:var(--bad);font-weight:700;min-height:20px;margin:-4px 0 10px;font-size:13px}
.okmsg{background:var(--bg);border:1px solid var(--bd);color:var(--a);border-radius:10px;padding:8px 12px;margin-bottom:14px;text-align:center;font-weight:800}
.hint{margin:14px 0 0;font-size:12.5px;color:var(--mu);text-align:center;background:var(--bg);border-radius:10px;padding:8px}
.chart{direction:ltr}
/* RTL (Arab) */
[dir="rtl"] aside{border-right:0;border-left:1px solid var(--bd)}
[dir="rtl"] .stat ul{padding:0 14px 0 0;border-left:0;border-right:2px solid var(--bd)}
[dir="rtl"] .stat.dk ul{border-right-color:var(--l)}
[dir="rtl"] .hero img{right:auto;left:-6px}
[dir="rtl"] .hero .ids{left:auto;right:20px}
[dir="rtl"] .score{margin-left:0;margin-right:auto;text-align:left}
[dir="rtl"] .ms{border-radius:14px 14px 4px 14px}[dir="rtl"] .ms.me{border-radius:14px 14px 14px 4px}
[dir="rtl"] .bk .ico,[dir="rtl"] .nb .ico,[dir="rtl"] .btn .ico{transform:scaleX(-1)}
[dir="rtl"] .sw:after{left:auto;right:4px}[dir="rtl"] .sw[aria-checked="true"]:after{transform:translateX(-20px)}
@media(max-width:900px){[dir="rtl"] aside{left:auto;right:0;transform:translateX(102%)}[dir="rtl"] body.nav aside{transform:none}}

/* ---------- revisi: tanpa outline/garis tepi ---------- */
:focus,:focus-visible{outline:none!important}
aside{border-right:0!important;border-left:0!important}
.card,.stat,.sr,.sq,.menu,.rm,.tb,.btn,.lcard,.lang,.qty,.okmsg,.nara,.sel,.bi,.fld input,.in input,.pw input,#toast,.dt{border:0!important}
.btn{background:var(--bg)}
.btn:hover{background:var(--tr)}
.tb{background:var(--c)}
.tb:hover,.sq:hover,.rm:hover{box-shadow:var(--shadow)}
.sr:focus-within{box-shadow:var(--shadow)}
.fld input:focus,.in input:focus{background:var(--tr)}
.bi{background:var(--bg)}
.sq i{border:2px solid var(--c)!important}

/* ---------- revisi: hari, tanggal & jam ---------- */
.dt{height:44px;background:var(--c);border-radius:12px;padding:0 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;line-height:1.15;white-space:nowrap}

/* ---------- revisi: kartu Saldo gaya Prestasi ---------- */
.stat.saldo{cursor:default}
.stat.saldo .n{font-size:34px;line-height:1.1;white-space:nowrap}

/* ---------- revisi: Mading ---------- */
.mad-note{margin-top:16px}

/* ---------- revisi: layar loading ---------- */

const donut=(segs,label)=>{const r=42,C=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{const len=C*s.v/tot,el=`<circle cx="55" cy="55" r="${r}" fill="none" stroke="${s.c}" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 55 55)"/>`;off+=len;return el}).join('');
  return `<div class="dn"><svg viewBox="0 0 110 110" role="img" aria-label="${label}"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--tr)" stroke-width="12"/>${arcs}</svg><b>${label}</b></div>`};
const HADIR=[{v:27,c:'#8dbb4f'},{v:3,c:'#e6a73a'},{v:0,c:'#c9473b'}];
const TEPAT=[{v:22,c:'#8dbb4f'},{v:7,c:'#e6a73a'}];

const wrapLab=t=>{const L=[];let c='';t.split(' ').forEach(x=>{if(c&&(c+' '+x).length>12){L.push(c);c=x}else c=c?c+' '+x:x});if(c)L.push(c);return L.slice(0,3)};
function chart(name){const a=SUB[name].slice(0,10),labs=CH[name],b=a.map((v,i)=>Math.round(72+((i*37+name.length*5)%17)));
  const W=680,H=250,L=44,B=40,sx=i=>L+22+i*(W-L-60)/9,sy=v=>H-B-(v-50)/50*(H-B-10);
  const pth=s=>s.map((v,i)=>{if(!i)return`M${sx(0)},${sy(v)}`;const x0=sx(i-1),x1=sx(i),dx=(x1-x0)/2;return`C${x0+dx},${sy(s[i-1])} ${x1-dx},${sy(v)} ${x1},${sy(v)}`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H+30}" role="img" aria-label="Grafik nilai ${name}"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8dbb4f" stop-opacity=".4"/><stop offset="1" stop-color="#8dbb4f" stop-opacity="0"/></linearGradient></defs>
${[50,60,70,80,90,100].map(v=>`<line class="gl" x1="${L}" x2="${W}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end">${v}</text>`).join('')}
<path d="${pth(b)}L${sx(9)},${sy(50)}L${sx(0)},${sy(50)}Z" fill="url(#gr)"/><path d="${pth(b)}" fill="none" stroke="var(--s2)" stroke-width="3" stroke-linecap="round"/><path d="${pth(a)}" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linecap="round"/>
${a.map((v,i)=>`<circle cx="${sx(i)}" cy="${sy(v)}" r="4.5" fill="var(--s1)"/><text x="${sx(i)}" y="${sy(v)-9}" text-anchor="middle" style="font-weight:800">${v}</text>${wrapLab(labs[i]).map((l,j)=>`<text x="${sx(i)}" y="${H-12+j*13}" text-anchor="middle" translate="no">${l}</text>`).join('')}`).join('')}</svg>`}

function toast(m){if(!m)return;const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('s'),1800)}
function theme(){const r=document.documentElement;r.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}render(true)}
function bind(){
  Q('[data-go]').forEach(e=>{e.onclick=ev=>{ev.stopPropagation();location.hash=e.dataset.go};e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();location.hash=e.dataset.go}}});
  Q('[data-toast]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();toast(e.dataset.toast)});
  Q('[data-arg]').forEach(e=>e.onclick=()=>{arg=e.dataset.arg;$('.page').innerHTML=PAGES[route]();bind()});
  Q('[data-add]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const k=e.dataset.add;CART[k]=(CART[k]||0)+1;$('#shop').innerHTML=shopHTML();bind()});
  Q('[data-dec]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const k=e.dataset.dec;CART[k]=(CART[k]||1)-1;if(CART[k]<=0)delete CART[k];$('#shop').innerHTML=shopHTML();bind()});
  $('#tg').onclick=theme;const t2=$('#tg2');if(t2)t2.onclick=theme;
  $('#mn').onclick=()=>document.body.classList.toggle('nav');$('#scrim').onclick=()=>document.body.classList.remove('nav');
  $('#q').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim())location.hash='cari?'+encodeURIComponent(e.target.value.trim())};
  const s=$('#sub');if(s)s.onchange=()=>$('#chart').innerHTML=chart(s.value);
  const sn=$('#snd');if(sn){const send=()=>{const v=$('#mi').value.trim();if(!v)return;$('#ch').insertAdjacentHTML('beforeend','<div class="ms me">'+v.replace(/</g,'&lt;')+'</div>');$('#mi').value='';setTimeout(()=>{$('#ch').insertAdjacentHTML('beforeend','<div class="ms">Terima kasih, pesan Anda sudah kami terima.</div>');$('#ch').scrollTop=9e4},700);$('#ch').scrollTop=9e4};sn.onclick=send;$('#mi').onkeydown=e=>{if(e.key=='Enter')send()}}}

/* ---------- sampul buku asli (Google Books) dengan sampul pengganti ---------- */
const CVC=(()=>{try{return JSON.parse(localStorage.getItem('cv')||'{}')}catch(e){return{}}})();
async function gb(q){const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=3&printType=books&q='+q);if(!r.ok)throw 0;const j=await r.json();
  for(const it of j.items||[]){const l=it.volumeInfo&&it.volumeInfo.imageLinks;if(l){const u=l.thumbnail||l.smallThumbnail;if(u)return u.replace(/^http:/,'https:').replace('&edge=curl','').replace('zoom=1','zoom=2')}}return''}
async function findCover(t,a){const k=t+'|'+a;if(CVC[k]!==undefined)return CVC[k];let u='';
  try{u=await gb('intitle:'+encodeURIComponent(t)+'+inauthor:'+encodeURIComponent(a))||await gb('intitle:'+encodeURIComponent(t))}catch(e){return''}
  CVC[k]=u;if(u)try{localStorage.setItem('cv',JSON.stringify(CVC))}catch(e){}return u}
function loadCovers(){Q('[data-cv]').forEach(async el=>{const p=el.dataset.cv.split('.'),b=CATS[p[0]][2][p[1]],u=await findCover(b[0],b[1]);if(!u||!el.isConnected)return;
  const im=new Image();im.alt=b[0];im.onload=()=>{if(!el.isConnected||im.naturalWidth<60)return;el.classList.add('img');el.innerHTML='';el.appendChild(im)};im.src=u})}

const TJX=['terminal bunder','terminal kertajaya','terminal porong','bungurasih luar','transit point trans jatim','medaeng','gunung gedangan','sekar putih'];
const tjNm=s=>s.replace(/^(Halte|Shelter|Rambu) /,'').replace(/ ?\(OD\)/,'').replace(/ ?(\d+|I|II)$/,'').toLowerCase();
const rad=Math.PI/180;
const hav=(a,b)=>{const x=Math.sin((b[0]-a[0])*rad/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin((b[1]-a[1])*rad/2)**2;return 12742*Math.asin(Math.sqrt(x))};
TJC.forEach(c=>{c.D=c.d.map((d,i)=>{const pts=i?c.an.slice().reverse():c.an.slice(),cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+hav(pts[k-1],pts[k]));
  const len=cum[cum.length-1],st=d.s.split('|').map(x=>x.replace(/^Halte /,'').trim()),n=st.length,dur=Math.max(30,Math.round(len/28*60+n*.5));
  return{n:d.n,pts,cum,len,st,dur,n_:n,from:st[0],to:st[n-1]}});
  c.D.forEach(D=>{D.sp=D.st.map((_,j)=>tjAt(D,j/(D.n_-1)))});
  c.t0=300+(c.id-1)*2;c.last=1170});
function tjAt(D,f){const L=f*D.len;let k=1;while(k<D.cum.length-1&&D.cum[k]<L)k++;const a=D.pts[k-1],b=D.pts[k],t=Math.min(1,Math.max(0,(L-D.cum[k-1])/((D.cum[k]-D.cum[k-1])||1)));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
const TJXF={};TJC.forEach(c=>c.D.forEach(D=>D.st.forEach(s=>{const k=tjNm(s);if(TJX.includes(k))(TJXF[k]=TJXF[k]||new Set()).add(c.id)})));
const tjXf=(c,s)=>{const k=tjNm(s),r=TJXF[k];return r?[...r].filter(x=>x!=c.id):[]};

/* ---------- jam (WIB) & simulasi ---------- */
const TJT={base:0,t0:Date.now(),mult:1};
function tjWib(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>+p.find(x=>x.type==t).value;return(g('hour')%24)*60+g('minute')+g('second')/60}
TJT.base=tjWib();
const tjNow=()=>(TJT.base+(Date.now()-TJT.t0)/60000*TJT.mult)%1440;
const tjPad=n=>String(n).padStart(2,'0');
const tjHM=m=>{m=((m%1440)+1440)%1440;return tjPad(Math.floor(m/60))+'.'+tjPad(Math.floor(m%60))};
const tjHMS=m=>{m=((m%1440)+1440)%1440;return tjPad(Math.floor(m/60))+':'+tjPad(Math.floor(m%60))+':'+tjPad(Math.floor((m*60)%60))};
const tjOpen=T=>T>=300&&T<=1290;
function tjSetClock(base,mult){TJT.base=base==null?tjNow():base;TJT.t0=Date.now();TJT.mult=mult}

/* ---------- mesin simulasi bus ---------- */
const tjId=(c,d,k)=>`TJ-${c.id}${'AB'[d]}-${tjPad(k%(Math.ceil(c.D[d].dur/c.hw)+1)+1)}`;
function tjBuses(T,cf){const out=[];TJC.forEach(c=>{if(cf&&cf!=c.id)return;c.D.forEach((D,di)=>{for(let t=c.t0,k=0;t<=c.last;t+=c.hw,k++){if(T>=t&&T<=t+D.dur){const f=(T-t)/D.dur,fi=f*(D.n_-1),j=Math.min(D.n_-1,Math.floor(fi)+1);
  out.push({id:tjId(c,di,k),c:c.id,d:di,k,f,pos:tjAt(D,f),next:j,nextName:D.st[j],eta:Math.max(0,(j/(D.n_-1)-f)*D.dur),end:t+D.dur,spd:22+(k*7+c.id*3+di*5)%24,load:(k*5+c.id+di)%3})}}})});
  return out.sort((a,b)=>a.c-b.c||a.d-b.d||a.f-b.f)}
function tjArrivals(c,d,j,T,max=6){const C=TJC[c-1],D=C.D[d],sf=j/(D.n_-1),r=[];
  for(let day=0;day<2;day++)for(let t=C.t0,k=0;t<=C.last;t+=C.hw,k++){const arr=t+sf*D.dur,eta=arr+day*1440-T;if(eta>=-.5)r.push({id:tjId(C,d,k),eta,arr,t,running:day==0&&t<=T})}
  return r.sort((a,b)=>a.eta-b.eta).slice(0,max)}
const tjMin=e=>Math.max(1,Math.round(e))+' menit';

return C('Transportasi Umum',stats+clk+`<div class="tabs">${tabs.map(t=>`<button class="tb${TJ.tab==t[0]?' on':''}" data-tj="tab:${t[0]}">${t[1]}</button>`).join('')}</div>`+tjBody(T),'Layanan bus TransJatim: rute, peta, kedatangan, dan posisi bus')};

 return `${tjChips(c,0,'rc')}<div class="card"><div class="tjdirs">${C.D.map((x,i)=>`<button class="chip${d==i?' on':''}" style="--cc:${C.col}" data-tj="dir:${i}" translate="no">${x.n}</button>`).join('')}</div>

function tjDet(T){const b=tjBuses(T).find(x=>x.id==TJ.sel);if(!b)return '<p class="tjempty">Pilih bus di peta atau daftar</p>';const C=TJC[b.c-1],D=C.D[b.d];

${tjChips(c,0,'rc')}<div class="tjdirs">${C.D.map((x,i)=>`<button class="chip${d==i?' on':''}" style="--cc:${C.col}" data-tj="dir:${i}" translate="no">${x.n}</button>`).join('')}</div>${pick}

<small class="upd" style="display:block;margin-bottom:6px">Jumlah tiket</small><div class="txq"><button class="chip" data-tj="qty:-1" aria-label="Kurangi"${TX.qty<=1?' disabled':''}>−</button><b translate="no">${TX.qty}</b><button class="chip" data-tj="qty:1" aria-label="Tambah"${TX.qty>=4?' disabled':''}>+</button></div>
<div class="tjplan" style="margin:0"><b>Data pelajar</b><div class="pr"><div><small>Nama</small><b translate="no">${TXS.nm}</b></div><div><small>NISN</small><b translate="no">${TXS.nisn}</b></div><div><small>Kelas</small><b translate="no">${TXS.kls}</b></div><div><small>Sekolah</small><b translate="no">${TXS.sch}</b></div></div>
<label class="txck"><input type="checkbox" data-txok${TX.ok?' checked':''}><span>Saya akan membawa seragam atau kartu pelajar aktif saat naik bus.</span></label></div>
<div class="txsum"><div class="dr"><small>Tiket pelajar</small><b translate="no">${rp(TXP)} × ${TX.qty}</b></div><div class="dr"><small>Total</small><b translate="no">${rp(tot)}</b></div><div class="dr"><small>Saldo</small><b translate="no">${rp(FIN.saldo)}</b></div><div class="dr"><small>Sisa saldo</small><b translate="no" style="color:${left<0?'var(--bad)':'inherit'}">${rp(left)}</b></div></div>
<button class="pb wide" data-tj="pay:1" style="margin-top:12px;padding:12px">Bayar dan beli tiket</button>
${left<0?'<p class="tjwarn"><span>Saldo tidak cukup.</span> <a class="link" href="#keuangan">Isi saldo</a></p>':''}</div>`;
  const mine=TIX.length?TIX.map(t=>{const k=TJC[t.c-1],st=txSt(t),op=TX.open==t.id;
    return `<button class="tjb${op?' on':''}" data-tj="tkv:${t.id}">${tjKb(k)}<span class="tx"><b translate="no">${t.from} → ${t.to}</b><small translate="no">${txLbl(t.date)} · ×${t.qty} · ${rp(t.total)}</small></span><span class="ra">${txTag(st)}</span></button>${op?`<div style="padding:10px 0 14px">${txCard(t)}${st=='a'?`<button class="btn" style="margin-top:10px" data-tj="tkc:${t.id}">Batalkan tiket</button>`:''}</div>`:''}`}).join(''):'<p class="tjempty">Belum ada tiket. Beli tiket pertamamu lewat formulir pembelian.</p>';
  return `<div class="txg"><div class="stack">${form}</div><div class="stack"><div class="card" id="txmine"><div class="ct"><h3>Tiket saya</h3></div><div class="tjlist" style="max-height:none">${mine}</div></div>
<div class="card"><div class="ct"><h3>Catatan tiket</h3></div><ul class="tjul"><li>Satu tiket berlaku untuk satu kali perjalanan pada tanggal yang dipilih.</li><li>Transit antar koridor gratis maksimal 2 jam dengan tiket yang sama.</li><li>Pembayaran memakai Saldo di menu Keuangan. Tiket yang dibatalkan mengembalikan saldo penuh.</li><li>Tiket ini simulasi di dashboard sekolah. Di bus, tetap bayar lewat QRIS, uang elektronik, atau aplikasi TRANSJATIM AJAIB, dan tunjukkan seragam atau kartu pelajar.</li></ul></div></div></div>`}
function txBuy(){const{c,d,j}=TJ.my,to=TJ.to,D=TJC[c-1].D[d];
  if(to==null||to<=j)return toast('Pilih halte tujuan dulu');
  if(!TX.ok)return toast('Centang konfirmasi pelajar dulu');
  const tot=TXP*TX.qty;if(tot>FIN.saldo)return toast('Saldo tidak cukup. Isi saldo di menu Keuangan');
  FIN.saldo-=tot;FIN.log.unshift(['Tiket TransJatim Pelajar',fdate(),tot,'-']);finSave();
  const t={id:Date.now().toString(36),code:'TJP-'+Math.random().toString(36).slice(2,8).toUpperCase(),c,d,from:D.st[j],to:D.st[to],qty:TX.qty,date:txISO(TX.day),total:tot,at:fdate(),st:'a'};
  TIX.unshift(t);txSave();TX.open=t.id;TX.ok=false;TX.qty=1;toast('Tiket berhasil dibeli');tjFull();
  setTimeout(()=>{const e=$('#txmine');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},60)}
function txCancel(id){const t=TIX.find(x=>x.id==id);if(!t||txSt(t)!='a')return;
  t.st='x';FIN.saldo+=t.total;FIN.log.unshift(['Refund tiket TransJatim',fdate(),t.total,'+']);finSave();txSave();toast('Tiket dibatalkan, saldo dikembalikan');tjFull()}

function tjTick(){if(route!='transum')return;const T=tjNow(),bs=tjBuses(T),w=(s,h)=>{const e=$(s);if(e&&e.innerHTML!==h)e.innerHTML=h};
 w('#tjclk',tjHMS(T));w('#tjst',tjStatus(tjOpen(T)));w('#tjn',String(bs.length));
 if(TJ.tab=='map'){w('#tjdet',tjDet(T));w('#tjbl',tjList(T));if(TJ.map){const vis=bs.filter(b=>!TJ.cor||b.c==TJ.cor);TJ.map.k=='G'?tjGB(vis):TJ.map.k=='L'?tjLB(vis):tjSB(vis)}}
 else if(TJ.tab=='route')w('#tjtl',tjTl(T));else if(TJ.tab=='arr')w('#tjarr',tjArr(T))}
function tjFull(){const y=scrollY;$('.page').innerHTML=PAGES.transum();bind();scrollTo(0,y)}
function tjAct(a,v){const T=tjNow();
 if(a=='tab'){TJ.tab=v;return tjFull()}
 if(a=='cor'){TJ.cor=+v;return tjFull()}
 if(a=='rc'){TJ.my={c:+v,d:0,j:0};TJ.to=null;return tjFull()}
 if(a=='dir'){TJ.my.d=+v;TJ.my.j=0;TJ.to=null;return tjFull()}
 if(a=='goroute'){TJ.my={c:+v,d:0,j:0};TJ.to=null;TJ.tab='route';return tjFull()}
 if(a=='stop'){TJ.my.j=+v;TJ.to=null;TJ.tab='arr';return tjFull()}
 if(a=='stopmap'){const[c,i]=v.split('.');TJ.my={c:+c,d:0,j:+i};TJ.to=null;TJ.tab='arr';return tjFull()}
 if(a=='bus'){TJ.sel=v;const b=tjBuses(T).find(x=>x.id==v);if(b&&TJ.map&&TJ.map.k=='L')TJ.map.m.panTo(b.pos);else if(b&&TJ.map&&TJ.map.k=='G')TJ.map.m.easeTo({center:[b.pos[1],b.pos[0]],zoom:Math.max(TJ.map.m.getZoom(),14.5),duration:1100});return tjTick()}
  if(a=='m3d'||a=='mfit'){const S=TJ.map;if(!S||S.k!='G')return;const flat=S.m.getPitch()<10;
   if(a=='mfit')return S.m.fitBounds(S.bb,{padding:44,pitch:flat?0:55,bearing:flat?0:-14,duration:900});
   S.m.easeTo({pitch:flat?55:0,bearing:flat?-14:0,duration:900});const b=$('[data-tj="m3d"]');if(b){b.textContent=flat?'3D':'2D';b.classList.toggle('on',flat)}return}
  if(a=='day'){TX.day=+v;return tjFull()}
  if(a=='qty'){TX.qty=Math.min(4,Math.max(1,TX.qty+(+v)));return tjFull()}
  if(a=='buy'){TJ.tab='tix';return tjFull()}
  if(a=='pay')return txBuy();
  if(a=='tkv'){TX.open=TX.open==v?null:v;return tjFull()}
  if(a=='tkc')return txCancel(v);
 if(a=='clk'){tjSetClock(null,+v);return tjFull()}
 if(a=='start'){tjSetClock(420,TJT.mult==1?30:TJT.mult);return tjFull()}}
document.addEventListener('click',e=>{if(route!='transum')return;const t=e.target.closest('[data-tj]');if(!t)return;const q=t.dataset.tj,i=q.indexOf(':');tjAct(i<0?q:q.slice(0,i),i<0?'':q.slice(i+1))});
document.addEventListener('change',e=>{if(route!='transum')return;const k=e.target.closest('[data-txok]');if(k){TX.ok=k.checked;return}const s=e.target.closest('[data-tjs]');if(!s)return;
 if(s.dataset.tjs=='from'){TJ.my.j=+s.value;if(TJ.to!=null&&TJ.to<=TJ.my.j)TJ.to=null}else TJ.to=s.value===''?null:+s.value;tjFull()});
const _bTJ=bind;bind=function(){_bTJ();if(route=='transum'&&TJ.tab=='map')tjMapInit()};
setInterval(tjTick,1000);
